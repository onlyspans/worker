syntax = "proto3";

package targets;

option csharp_namespace = "Targets.Communication";

service TargetsService {
  rpc ExecuteOnTarget(stream DeploymentInput) returns (stream ExecutionResult);
}

message DeploymentInput {
  oneof payload {
    StepTargetMetadata metadata = 1;
    ArtifactChunk artifact_chunk = 2;
  }
}

message StepTargetMetadata {
  string deployment_id = 1;
  string step_id = 2;
  string step_name = 3;
  string target_id = 4;
  StepCommand command = 5;
  map<string, string> environment_variables = 6;
  string execution_id = 7;
}

message StepCommand {
  CommandType type = 1;
  int32 timeout_seconds = 2;
  string working_directory = 3;

  oneof source {
    string inline_script = 10;
    string script_path = 11;
  }
}

enum CommandType {
  COMMAND_TYPE_UNSPECIFIED = 0;
  COMMAND_TYPE_SHELL = 1;
  COMMAND_TYPE_KUBERNETES = 2;
  COMMAND_TYPE_HELM = 3;
}

message ArtifactChunk {
  bytes data = 1;
  bool is_last = 2;
}

message ExecutionResult {
  string deployment_id = 1;
  int64 timestamp = 2;
  ResultType type = 3;
  string message = 4;
  optional bytes data = 5;
  string execution_id = 6;
  optional LogLevel log_level = 7;
}

enum ResultType {
  RESULT_TYPE_UNSPECIFIED = 0;
  RESULT_TYPE_LOG = 1;
  RESULT_TYPE_PROGRESS = 2;
  RESULT_TYPE_SUCCESS = 3;
  RESULT_TYPE_ERROR = 4;
}

enum LogLevel {
  LOG_LEVEL_UNSPECIFIED = 0;
  LOG_LEVEL_DEBUG = 1;
  LOG_LEVEL_INFO = 2;
  LOG_LEVEL_WARNING = 3;
  LOG_LEVEL_ERROR = 4;
}

syntax = "proto3";

package worker;

option csharp_namespace = "Worker.Communication";

service WorkerService {
  
  
  
  rpc ExecuteDeployment(stream DeploymentInput) returns (stream DeploymentMessage);
}

message DeploymentInput {
  oneof input {
    DeploymentMetadata metadata = 1;   
    SnapshotChunk snapshot_chunk = 2;  
  }
}

message DeploymentMetadata {
  string deployment_id = 1;
  string project_id = 2;
  string environment_id = 3;
  string target_id = 4;
  map<string, string> resolved_variables = 5;  
  string target_type = 6;  
}

message SnapshotChunk {
  bytes data = 1;
  bool is_last = 2;
}

message DeploymentMessage {
  oneof message {
    LogChunk log = 1;
    DeploymentResult result = 2;
  }
}

message LogChunk {
  string deployment_id = 1;
  int64 timestamp = 2;  
  LogLevel level = 3;
  string message = 4;
  optional string source = 5;  
}

enum LogLevel {
  LOG_LEVEL_UNSPECIFIED = 0;
  LOG_LEVEL_DEBUG = 1;
  LOG_LEVEL_INFO = 2;
  LOG_LEVEL_WARNING = 3;
  LOG_LEVEL_ERROR = 4;
}

message DeploymentResult {
  message Success {
    string deployment_id = 1;
    int64 completed_at = 2;  
    string summary = 3;
  }

  message Error {
    string deployment_id = 1;
    ErrorType error_type = 2;
    string message = 3;
    optional string trace = 4;  
  }

  
  oneof result {
    Success success = 1;
    Error error = 2;
  }
}

enum ErrorType {
  ERROR_TYPE_UNSPECIFIED = 0;
  ERROR_TYPE_SNAPSHOT_DOWNLOAD_FAILED = 1;
  ERROR_TYPE_TARGET_EXECUTION_FAILED = 2;
  ERROR_TYPE_INTERNAL = 3;
}

services:

  worker:
    image: onlyspans.worker.api
    build:
      context: ./src
      dockerfile: Onlyspans.Worker.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Database: "Host=postgres;Database=worker;Username=worker;Password=dev"
      TargetsController__Endpoint: "http://targets-controller:8080"
      Processes__Endpoint: "http://processes:5002"
    ports:
      - "5003:8080"
    networks:
      - default
      - developer-platform
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: worker
      POSTGRES_USER: worker
      POSTGRES_PASSWORD: dev
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U worker"]
      interval: 5s
      timeout: 5s
      retries: 5

networks:
  developer-platform:
    external: true

services:
  # Context must be ./src so Dockerfile COPY paths resolve correctly
  # Dockerfile: src/Onlyspans.Worker.Api/Dockerfile uses COPY ["Onlyspans.Worker.Api/...", ...]
  worker:
    image: onlyspans.worker.api
    build:
      context: ./src
      dockerfile: Onlyspans.Worker.Api/Dockerfile
    environment:
      ConnectionStrings__Database: "Host=postgres;Database=worker;Username=worker;Password=dev"
      TargetsController__Endpoint: "http://targets-controller:5001"
      Processes__Endpoint: "http://processes:5002"
      Messaging__Enabled: "false"
      Messaging__Kafka__BootstrapServers: "kafka:9092"
      Messaging__Kafka__Topic: "worker-logs"
      S3__BucketName: "onlyspans-snapshots"
      S3__Endpoint: "http://localstack:4566"
    ports:
      - "5003:8080"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: worker
      POSTGRES_USER: worker
      POSTGRES_PASSWORD: dev
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U worker"]
      interval: 5s
      timeout: 5s
      retries: 5

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181

  localstack:
    image: localstack/localstack:3.0
    environment:
      SERVICES: s3
      DEFAULT_REGION: us-east-1
    ports:
      - "4566:4566"
